name: CI/CD Docker Pipeline

# Триггер: запускать пайплайн при каждом push или Pull Request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем свежий код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Проверяем работоспособность Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Собираем Docker-образ на серверах GitHub
    - name: Build Docker Image
      run: |
        docker build -t automation-app:ci .

    # 4. Тестируем запуск контейнера
    - name: Run Docker Container
      run: |
        docker run --rm automation-app:ci
