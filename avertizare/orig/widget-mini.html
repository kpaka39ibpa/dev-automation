<!-- Контейнер мини-карты meteo.md -->
<div id="meteo-mini-widget" style="position: relative; width: 100%; height: 380px; border-radius: 8px; overflow: hidden; border: 1px solid #ccc;">
    <div id="meteo-mini-map" style="width: 100%; height: 100%;"></div>
    
    <!-- Компактная плашка текущего статуса -->
    <div id="meteo-mini-info" style="position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-family: sans-serif; font-size: 13px; z-index: 1000; display: none;">
        <strong id="mini-district-name" style="color: #000;"></strong>: 
        <span id="mini-status-badge" style="padding: 2px 6px; border-radius: 3px; font-weight: bold; color: #fff;"></span>
        <div id="mini-desc" style="font-size: 11px; color: #444; margin-top: 3px;"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/meteo-widget.standalone.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Инициализация мини-виджета
        MeteoWidget.init({
            mapContainerId: 'meteo-mini-map',
            geojsonUrl: 'data/map.geojson',
            warningsUrl: 'data/meteo_warning_active.json'
        });
    });
</script>
