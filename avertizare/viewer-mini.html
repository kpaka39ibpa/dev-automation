<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Warning Mini</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .leaflet-container {
            background: transparent !important;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let geojsonLayer;
        let geoData = null;
        let activeWarnings = {};

        const COLOR_MAP = {
            green: '#4CAF50',
            yellow: '#FFEB3B',
            orange: '#FF9800',
            red: '#F44336'
        };

        function getFeatureId(f) {
            return f.properties.ID_1 || f.properties.id || f.properties.name || f.properties.NAME_1;
        }

        // Проверка времени: автоматический возврат в зеленый при истечении срока
        function getDistrictStatus(districtId) {
            const raw = activeWarnings[districtId];
            if (!raw) return 'green';

            const now = new Date();

            if (raw.validUntil && new Date(raw.validUntil) <= now) {
                return 'green';
            }

            if (raw.validFrom && new Date(raw.validFrom) > now) {
                return 'green';
            }

            return raw.level || 'green';
        }

        function styleFeature(feature) {
            const id = getFeatureId(feature);
            const level = getDistrictStatus(id);
            
            return {
                fillColor: COLOR_MAP[level] || COLOR_MAP.green,
                weight: 1,
                opacity: 1,
                color: '#ffffff',
                fillOpacity: 0.95
            };
        }

        async function initMiniWidget() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                touchZoom: false
            });

            try {
                const [mapRes, warnRes] = await Promise.all([
                    fetch('data/map.geojson'),
                    fetch('data/meteo_warning_active.json?t=' + Date.now()).catch(() => null)
                ]);

                if (!mapRes.ok) return;
                geoData = await mapRes.json();

                if (warnRes && warnRes.ok) {
                    activeWarnings = await warnRes.json();
                }

                geojsonLayer = L.geoJSON(geoData, {
                    style: styleFeature,
                    onEachFeature: (feature, layer) => {
                        layer.on({
                            mouseover: (e) => e.target.setStyle({ weight: 2, color: '#222' }),
                            mouseout: (e) => geojsonLayer.resetStyle(e.target)
                        });
                    }
                }).addTo(map);

                // Автоматически подогнать масштабы Молдовы под рамку
                map.fitBounds(geojsonLayer.getBounds(), { padding: [2, 2] });

            } catch (e) {
                console.error('Widget error:', e);
            }
        }

        // --- Публичный API фрейма ---
        window.MeteoApi = {
            setGlobalLevel: function(level) {
                const nowIso = new Date().toISOString();
                if (geoData && geoData.features) {
                    geoData.features.forEach(f => {
                        const id = getFeatureId(f);
                        activeWarnings[id] = {
                            level: level,
                            validFrom: level === 'green' ? null : nowIso,
                            validUntil: null
                        };
                    });
                }
                if (geojsonLayer) geojsonLayer.setStyle(styleFeature);
            },
            refresh: function() {
                if (geojsonLayer) geojsonLayer.setStyle(styleFeature);
            }
        };

        // Слушатель событий postMessage для внешней работы API
        window.addEventListener('message', (e) => {
            if (e.data && e.data.action === 'setGlobalLevel') {
                window.MeteoApi.setGlobalLevel(e.data.level);
            }
        });

        // Авто-пересчет цвета по времени каждые 15 сек
        setInterval(() => {
            if (geojsonLayer) geojsonLayer.setStyle(styleFeature);
        }, 15000);

        document.addEventListener('DOMContentLoaded', initMiniWidget);
    </script>
</body>
</html>
